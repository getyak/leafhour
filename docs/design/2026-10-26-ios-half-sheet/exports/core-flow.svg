<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#365B47"/></marker></defs><rect width="1760" height="1080" fill="#F7F8F5"/><text x="64" y="76" fill="#365B47" font-family="-apple-system,PingFang SC,sans-serif" font-size="26" font-weight="500">Leafhour</text><text x="64" y="144" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="43" font-weight="500">从上次那一句继续</text><text x="64" y="190" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="400">阅读位置、讨论位置与临时出处各自保存，往返时不相互覆盖。</text><rect x="64" y="255" width="350" height="145" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="89" y="298" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">打开即续读</text><text x="89" y="334" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">缓存正文先可读</text><text x="89" y="362" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">陪读默认收起</text><rect x="490" y="255" width="350" height="145" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="515" y="298" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">选择词句</text><text x="515" y="334" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">解释／原文／记一句</text><text x="515" y="362" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">选择本身不改讨论上下文</text><rect x="916" y="255" width="350" height="145" rx="20" fill="#365B47" stroke="#365B47"/><text x="941" y="298" fill="#F7F8F5" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">半屏陪读</text><text x="941" y="334" fill="#D9E5DA" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">原句可见，上方正文可读</text><text x="941" y="362" fill="#D9E5DA" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">问题绑定已发送的选文</text><rect x="1342" y="255" width="350" height="145" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="1367" y="298" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">展开讨论</text><text x="1367" y="334" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">上拉或聚焦输入</text><text x="1367" y="362" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">草稿与回答位置保留</text><path d="M414 328H482" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 328H908" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><path d="M1266 328H1334" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><text x="1275" y="310" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">上拉</text><rect x="1342" y="548" width="350" height="145" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="1367" y="591" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">核对出处</text><text x="1367" y="627" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">临时查看作者原文</text><text x="1367" y="655" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">不覆盖正式阅读位置</text><rect x="916" y="548" width="350" height="145" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="941" y="591" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">返回讨论</text><text x="941" y="627" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">恢复问题、草稿、回答位置</text><text x="941" y="655" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">恢复原来的面板高度</text><rect x="490" y="548" width="350" height="145" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="515" y="591" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">继续阅读</text><text x="515" y="627" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">留在最新主动读到的位置</text><text x="515" y="655" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">「返回原句」是另一个动作</text><path d="M1517 400V540" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><text x="1533" y="476" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">点引用</text><path d="M1342 620H1274" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><path d="M916 620H848" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><text x="861" y="601" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">收起</text><path d="M490 620H239V409" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><text x="64" y="851" fill="#365B47" font-family="-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="500">正常启动</text><text x="64" y="885" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="400">恢复正文与排版。没有历史位置时进入书房；显式引用链接优先定位引用。</text><text x="916" y="851" fill="#365B47" font-family="-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="500">连接失败</text><text x="916" y="885" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="400">正文继续可读。问题与选文保留，恢复连接后显式重试。</text><text x="64" y="973" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="400">新选文遇到旧草稿：用新句另开草稿，原问题仍能找回。</text><text x="64" y="1042" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">设计原型 · 2026-10-26 · 与生产实现、原生手感验收分别记录</text></svg>