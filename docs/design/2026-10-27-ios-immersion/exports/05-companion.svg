<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><title>05 · 书在上方，陪读按需出现</title><defs><clipPath id="clip1"><rect width="402" height="776" rx="0"/></clipPath><clipPath id="clip2"><rect width="320" height="21.4375" rx="0"/></clipPath><clipPath id="clip3"><rect width="340" height="44" rx="0"/></clipPath><clipPath id="clip4"><rect width="402" height="296.484375" rx="0"/></clipPath><clipPath id="clip5"><rect width="309" height="46" rx="18"/></clipPath><clipPath id="clip6"><rect width="402" height="874" rx="0"/></clipPath></defs><g id="n1" aria-label="phone" transform="translate(0 0)" clip-path="url(#clip6)"><rect width="402" height="874" rx="0" fill="rgb(247, 248, 245)"/><g id="n2" aria-label="status-bar" transform="translate(0 0)"><rect width="402" height="54" rx="0" fill="rgb(247, 248, 245)"/><g id="n3" aria-label="SPAN" transform="translate(29 18)"><rect width="31.328125" height="18" rx="0" fill="none"/><text x="0" y="15" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="600" font-size="15" letter-spacing="0" xml:space="preserve">9:41</text></g><g id="n4" aria-label="island" transform="translate(145 12)"><rect width="112" height="30" rx="20" fill="rgb(18, 23, 18)"/></g><g id="n5" aria-label="status-icons" transform="translate(359.140625 13.5)"><rect width="13.859375" height="27" rx="0" fill="none"/><text x="0" y="22" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="600" font-size="23" letter-spacing="0" xml:space="preserve">▰</text></g></g><g id="n6" aria-label="显示阅读导航" transform="translate(0 0)"><rect width="402" height="54" rx="0" fill="none"/></g><g id="n7" aria-label="阅读正文" transform="translate(0 54)" clip-path="url(#clip1)"><rect width="402" height="776" rx="0" fill="none"/><g id="n8" aria-label="prose" transform="translate(26 -172.109375)"><rect width="350" height="551.25" rx="0" fill="none"/><g id="n9" aria-label="walden-2-001" transform="translate(0 0)"><rect width="350" height="188.5" rx="0" fill="none"/><g id="n10" aria-label="passage-text" transform="translate(0 32.5)"><rect width="332.25" height="150.75" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我来到林中，是想清醒地过日子，</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">面对生活最要紧的事实，看看生活</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">能教给我什么；我不想等到死时才</text><text x="0" y="143.75" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">发现，自己没有真正生活过。</text></g></g><g id="n11" aria-label="walden-2-002" transform="translate(0 215.5)"><rect width="350" height="120.75" rx="0" fill="none"/><g id="n12" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="110.5" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子这样珍贵，我不愿把它过成并</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">非生活的样子；只要还没有到非如</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">此不可的时候，我也不想认命。</text></g></g><g id="n13" aria-label="walden-2-003" transform="translate(0 363.25)"><rect width="350" height="120.75" rx="0" fill="none"/><g id="n14" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="110.5" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我想把生活过深，尝尽它的滋味；</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">用结实、简朴的日子，赶走那些算</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">不上生活的东西。</text></g></g><g id="n15" aria-label="walden-2-004" transform="translate(0 511)"><rect width="350" height="40.25" rx="0" fill="none"/><g id="n16" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="30" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子就在种种琐事里一点点消磨。</text></g></g></g></g><g id="n17" aria-label="显示本章进度" transform="translate(0 830)"><rect width="402" height="44" rx="0" fill="none"/></g><g id="n18" aria-label="阅读辅助" transform="translate(0 419.5306396484375)"><rect width="402" height="769.109375" rx="28" fill="rgb(255, 255, 255)" stroke="rgb(220, 227, 218)" stroke-width="1"/><g id="n19" aria-label="展开或收起面板" transform="translate(159 -9)"><rect width="84" height="44" rx="32" fill="none"/><g id="n20" aria-label="SPAN" transform="translate(25 20)"><rect width="34" height="4" rx="8" fill="rgb(220, 227, 218)"/></g></g><g id="n21" aria-label="sheet-header" transform="translate(0 25)"><rect width="402" height="47" rx="0" fill="none"/><g id="n22" aria-label="sheet-title" transform="translate(24 9.5)"><rect width="295" height="28" rx="0" fill="none"/><text x="0" y="21" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="600" font-size="20" letter-spacing="-0.3" xml:space="preserve">读到这里</text></g><g id="n23" aria-label="sheet-done" transform="translate(327 1.5)"><rect width="51" height="44" rx="0" fill="none"/><text x="12" y="27" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="13" letter-spacing="0" xml:space="preserve">继续读</text></g></g><g id="n24" aria-label="sheet-body" transform="translate(0 72)" clip-path="url(#clip4)"><rect width="402" height="296.484375" rx="0" fill="none"/><g id="n25" aria-label="context-quote" transform="translate(24 13)"><rect width="354" height="65.5" rx="0" fill="none"/><g id="n26" aria-label="SMALL" transform="translate(14 0)"><rect width="340" height="16.5" rx="0" fill="none"/><text x="0" y="12" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="10" letter-spacing="0" xml:space="preserve">正在读的段落 · 示例意译</text></g><g id="n27" aria-label="context-actions" transform="translate(14 21.5)"><rect width="340" height="44" rx="0" fill="none"/><g id="n28" aria-label="返回提问原句" transform="translate(0 0)" clip-path="url(#clip3)"><rect width="340" height="44" rx="0" fill="none"/><g id="n29" aria-label="quote-line" transform="translate(0 11.28125)" clip-path="url(#clip2)"><rect width="320" height="21.4375" rx="0" fill="none"/><text x="0" y="15" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="13" letter-spacing="0" xml:space="preserve">日子这样珍贵，我不愿把它过成并非生活的样子；只要还没有到非如此不可的时候，我也不想认命。</text></g><g transform="translate(328 16)"><svg width="12" height="12" fill="none" stroke="rgb(54, 91, 71)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(54, 91, 71)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 4H4v16h16v-6"></path></svg></g></g></g></g><g id="n30" aria-label="answer-label" transform="translate(24 94.5)"><rect width="354" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">讲解 · 示例</text></g><g id="n31" aria-label="answer" transform="translate(24 120.5)"><rect width="354" height="113.875" rx="0" fill="none"/><text x="0" y="20" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="400" font-size="16" letter-spacing="0" xml:space="preserve">这一段同时说到珍惜生活与不愿认命。</text><text x="0" y="76.9375" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="400" font-size="16" letter-spacing="0" xml:space="preserve">“除非确实有必要”保留了余地，不能删去这个限</text><text x="0" y="105.40625" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="400" font-size="16" letter-spacing="0" xml:space="preserve">定，读成任何时候都必须抗拒。</text></g><g id="n32" aria-label="source-link" transform="translate(24 248.375)"><rect width="39" height="44" rx="0" fill="none"/><text x="0" y="26" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">本段</text><g transform="translate(27 16)"><svg width="12" height="12" fill="none" stroke="rgb(54, 91, 71)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(54, 91, 71)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 4H4v16h16v-6"></path></svg></g></g><g id="n33" aria-label="answer-actions" transform="translate(24 308.375)"><rect width="354" height="40" rx="0" fill="none"/><g id="n34" aria-label="BUTTON" transform="translate(0 0)"><rect width="67" height="40" rx="0" fill="none"/><g transform="translate(4 11.5)"><svg width="17" height="17" fill="none" stroke="rgb(54, 91, 71)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(54, 91, 71)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H5l-4 3 1.6-6A8 8 0 1 1 20 11Z"></path><path d="M6 10h8M6 14h5"></path></svg></g><text x="27" y="24.5" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="12" letter-spacing="0" xml:space="preserve">接着聊</text></g><g id="n35" aria-label="BUTTON" transform="translate(287 0)"><rect width="67" height="40" rx="0" fill="none"/><g transform="translate(4 11.5)"><svg width="17" height="17" fill="none" stroke="rgb(54, 91, 71)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(54, 91, 71)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4H4v16h16V10m-9 3 8-8 3 3-8 8-4 1Z"></path></svg></g><text x="27" y="24.5" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="12" letter-spacing="0" xml:space="preserve">记一句</text></g></g></g><g id="n36" aria-label="composer" transform="translate(0 368.484375)"><rect width="402" height="55" rx="0" fill="rgb(255, 255, 255)" stroke="rgb(220, 227, 218)" stroke-width="1"/><g id="n37" aria-label="question-form" transform="translate(20 9)"><rect width="362" height="46" rx="0" fill="none"/><g id="n38" aria-label="继续问这段" transform="translate(0 0)" clip-path="url(#clip5)"><rect width="309" height="46" rx="18" fill="rgb(247, 248, 245)" stroke="rgb(220, 227, 218)" stroke-width="1"/><text x="14" y="26.84" fill="rgb(117, 117, 117)" font-family="-apple-system,sans-serif" font-weight="400" font-size="16" letter-spacing="0"><tspan x="14" dy="0">接着问这段…</tspan></text></g><g id="n39" aria-label="发送问题" transform="translate(318 1)"><rect width="44" height="44" rx="50" fill="rgb(54, 91, 71)"/><g id="n40" aria-label="SPAN" transform="translate(11 9.5)"><rect width="22" height="25" rx="0" fill="none"/><g transform="translate(0 0)"><svg width="22" height="22" fill="none" stroke="rgb(255, 255, 255)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(255, 255, 255)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"></path></svg></g></g></g></g></g></g><g id="n41" aria-label="home-indicator" transform="translate(140 861)"><rect width="122" height="4" rx="5" fill="rgb(36, 42, 39)"/></g></g></svg>