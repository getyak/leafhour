<svg xmlns="http://www.w3.org/2000/svg" width="320" height="740" viewBox="0 0 320 740"><title>06 · 夜读只剩文字</title><defs><clipPath id="clip1"><rect width="320" height="642" rx="0"/></clipPath><clipPath id="clip2"><rect width="320" height="740" rx="0"/></clipPath></defs><g id="n1" aria-label="phone" transform="translate(0 0)" clip-path="url(#clip2)"><rect width="320" height="740" rx="0" fill="rgb(25, 30, 27)"/><g id="n2" aria-label="status-bar" transform="translate(0 0)"><rect width="320" height="54" rx="0" fill="rgb(25, 30, 27)"/><g id="n3" aria-label="SPAN" transform="translate(29 18)"><rect width="31.328125" height="18" rx="0" fill="none"/><text x="0" y="15" fill="rgb(231, 238, 231)" font-family="-apple-system,sans-serif" font-weight="600" font-size="15" letter-spacing="0" xml:space="preserve">9:41</text></g><g id="n4" aria-label="island" transform="translate(104 12)"><rect width="112" height="30" rx="20" fill="rgb(18, 23, 18)"/></g><g id="n5" aria-label="status-icons" transform="translate(277.140625 13.5)"><rect width="13.859375" height="27" rx="0" fill="none"/><text x="0" y="22" fill="rgb(231, 238, 231)" font-family="-apple-system,sans-serif" font-weight="600" font-size="23" letter-spacing="0" xml:space="preserve">▰</text></g></g><g id="n6" aria-label="显示阅读导航" transform="translate(0 0)"><rect width="320" height="54" rx="0" fill="none"/></g><g id="n7" aria-label="阅读正文" transform="translate(0 54)" clip-path="url(#clip1)"><rect width="320" height="642" rx="0" fill="none"/><g id="n8" aria-label="chapter-heading" transform="translate(26 24)"><rect width="268" height="102.890625" rx="0" fill="none"/><g id="n9" aria-label="SPAN" transform="translate(0 4)"><rect width="39" height="13" rx="0" fill="none"/><text x="0" y="11" fill="rgb(174, 188, 175)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="2" xml:space="preserve">第二章</text></g><g id="n10" aria-label="H1" transform="translate(0 32)"><rect width="268" height="45.890625" rx="0" fill="none"/><text x="0" y="34" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="500" font-size="34" letter-spacing="1" xml:space="preserve">我为何生活</text></g><g id="n11" aria-label="version-label" transform="translate(0 86.890625)"><rect width="268" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(174, 188, 175)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">示例意译</text></g></g><g id="n12" aria-label="prose" transform="translate(26 158.890625)"><rect width="268" height="1081.953125" rx="0" fill="none"/><g id="n13" aria-label="walden-2-001" transform="translate(0 0)"><rect width="268" height="386.140625" rx="0" fill="none"/><g id="n14" aria-label="resume-mark" transform="translate(0 0)"><rect width="268" height="16.5" rx="0" fill="none"/><text x="0" y="10" fill="rgb(168, 203, 180)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0.15" xml:space="preserve">上次读到这里</text></g><g id="n15" aria-label="passage-text" transform="translate(0 32.5)"><rect width="253.359375" height="347.40625" rx="0" fill="none"/><text x="0" y="30" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">我来到林中，是想清</text><text x="0" y="81.234375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">醒地过日子，面对生</text><text x="0" y="132.46875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">活最要紧的事实，看</text><text x="0" y="183.703125" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">看生活能教给我什</text><text x="0" y="234.9375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">么；我不想等到死时</text><text x="0" y="286.171875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">才发现，自己没有真</text><text x="0" y="337.40625" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">正生活过。</text></g></g><g id="n16" aria-label="walden-2-002" transform="translate(0 413.140625)"><rect width="268" height="256.171875" rx="0" fill="none"/><g id="n17" aria-label="passage-text" transform="translate(0 5)"><rect width="253.359375" height="244.9375" rx="0" fill="none"/><text x="0" y="30" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">日子这样珍贵，我不</text><text x="0" y="81.234375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">愿把它过成并非生活</text><text x="0" y="132.46875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">的样子；只要还没有</text><text x="0" y="183.703125" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">到非如此不可的时</text><text x="0" y="234.9375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">候，我也不想认命。</text></g></g></g></g><g id="n18" aria-label="显示本章进度" transform="translate(0 696)"><rect width="320" height="44" rx="0" fill="none"/></g><g id="n19" aria-label="home-indicator" transform="translate(99 727)"><rect width="122" height="4" rx="5" fill="rgb(231, 238, 231)"/></g></g></svg>