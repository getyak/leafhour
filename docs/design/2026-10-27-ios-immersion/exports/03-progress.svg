<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><title>03 · 进度为主，陪读按召唤</title><defs><clipPath id="clip1"><rect width="402" height="776" rx="0"/></clipPath><clipPath id="clip2"><rect width="402" height="874" rx="0"/></clipPath></defs><g id="n1" aria-label="phone" transform="translate(0 0)" clip-path="url(#clip2)"><rect width="402" height="874" rx="0" fill="rgb(247, 248, 245)"/><g id="n2" aria-label="status-bar" transform="translate(0 0)"><rect width="402" height="54" rx="0" fill="rgb(247, 248, 245)"/><g id="n3" aria-label="SPAN" transform="translate(29 18)"><rect width="31.328125" height="18" rx="0" fill="none"/><text x="0" y="15" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="600" font-size="15" letter-spacing="0" xml:space="preserve">9:41</text></g><g id="n4" aria-label="island" transform="translate(145 12)"><rect width="112" height="30" rx="20" fill="rgb(18, 23, 18)"/></g><g id="n5" aria-label="status-icons" transform="translate(359.140625 13.5)"><rect width="13.859375" height="27" rx="0" fill="none"/><text x="0" y="22" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="600" font-size="23" letter-spacing="0" xml:space="preserve">▰</text></g></g><g id="n6" aria-label="显示阅读导航" transform="translate(0 0)"><rect width="402" height="54" rx="0" fill="none"/></g><g id="n7" aria-label="阅读正文" transform="translate(0 54)" clip-path="url(#clip1)"><rect width="402" height="776" rx="0" fill="none"/><g id="n8" aria-label="chapter-heading" transform="translate(26 24)"><rect width="350" height="102.890625" rx="0" fill="none"/><g id="n9" aria-label="SPAN" transform="translate(0 4)"><rect width="39" height="13" rx="0" fill="none"/><text x="0" y="11" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="2" xml:space="preserve">第二章</text></g><g id="n10" aria-label="H1" transform="translate(0 32)"><rect width="350" height="45.890625" rx="0" fill="none"/><text x="0" y="34" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="500" font-size="34" letter-spacing="1" xml:space="preserve">我为何生活</text></g><g id="n11" aria-label="version-label" transform="translate(0 86.890625)"><rect width="350" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">示例意译</text></g></g><g id="n12" aria-label="prose" transform="translate(26 158.890625)"><rect width="350" height="551.25" rx="0" fill="none"/><g id="n13" aria-label="walden-2-001" transform="translate(0 0)"><rect width="350" height="188.5" rx="0" fill="none"/><g id="n14" aria-label="resume-mark" transform="translate(0 0)"><rect width="350" height="16.5" rx="0" fill="none"/><text x="0" y="10" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0.15" xml:space="preserve">上次读到这里</text></g><g id="n15" aria-label="passage-text" transform="translate(0 32.5)"><rect width="332.25" height="150.75" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我来到林中，是想清醒地过日子，</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">面对生活最要紧的事实，看看生活</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">能教给我什么；我不想等到死时才</text><text x="0" y="143.75" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">发现，自己没有真正生活过。</text></g></g><g id="n16" aria-label="walden-2-002" transform="translate(0 215.5)"><rect width="350" height="120.75" rx="0" fill="none"/><g id="n17" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="110.5" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子这样珍贵，我不愿把它过成并</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">非生活的样子；只要还没有到非如</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">此不可的时候，我也不想认命。</text></g></g><g id="n18" aria-label="walden-2-003" transform="translate(0 363.25)"><rect width="350" height="120.75" rx="0" fill="none"/><g id="n19" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="110.5" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我想把生活过深，尝尽它的滋味；</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">用结实、简朴的日子，赶走那些算</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">不上生活的东西。</text></g></g><g id="n20" aria-label="walden-2-004" transform="translate(0 511)"><rect width="350" height="40.25" rx="0" fill="none"/><g id="n21" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="30" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子就在种种琐事里一点点消磨。</text></g></g></g></g><g id="n22" aria-label="显示本章进度" transform="translate(0 830)"><rect width="402" height="44" rx="0" fill="none"/></g><g id="n23" aria-label="本章进度" transform="translate(0 653)"><rect width="402" height="177" rx="0" fill="none"/><g id="n24" aria-label="companion-button" transform="translate(286 22)"><rect width="90" height="44" rx="10" fill="none"/><g id="n25" aria-label="SPAN" transform="translate(4 9.5)"><rect width="22" height="25" rx="0" fill="none"/><g transform="translate(0 0)"><svg width="22" height="22" fill="none" stroke="rgb(54, 91, 71)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(54, 91, 71)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H5l-4 3 1.6-6A8 8 0 1 1 20 11Z"></path><path d="M6 10h8M6 14h5"></path></svg></g></g><g id="n26" aria-label="companion-label" transform="translate(34 13)"><rect width="52" height="18" rx="0" fill="none"/><text x="0" y="14" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="13" letter-spacing="0" xml:space="preserve">读到这里</text></g></g><g id="n27" aria-label="progress-surface" transform="translate(26 74)"><rect width="350" height="91" rx="0" fill="none"/><g id="n28" aria-label="progress-caption" transform="translate(0 0)"><rect width="350" height="44" rx="0" fill="none"/><g id="n29" aria-label="progress-button" transform="translate(0 0)"><rect width="114" height="44" rx="10" fill="none"/><g id="n30" aria-label="SPAN" transform="translate(4 14)"><rect width="33" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">第二章</text></g><g id="n31" aria-label="dock-location" transform="translate(45 13)"><rect width="65" height="18" rx="0" fill="none"/><text x="0" y="14" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="400" font-size="13" letter-spacing="0" xml:space="preserve">琐事与日子</text></g></g><g id="n32" aria-label="progress-value" transform="translate(318.765625 15.5)"><rect width="31.234375" height="13" rx="0" fill="none"/><text x="0" y="11" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">100%</text></g></g><g id="n33" aria-label="本章阅读进度" transform="translate(0 44)"><rect width="350" height="44" rx="0" fill="rgb(255, 255, 255)"/><text x="0" y="25.84" fill="rgb(16, 16, 16)" font-family="-apple-system,sans-serif" font-weight="400" font-size="16" letter-spacing="0"><tspan x="0" dy="0">1000</tspan></text></g></g></g><g id="n34" aria-label="home-indicator" transform="translate(140 861)"><rect width="122" height="4" rx="5" fill="rgb(36, 42, 39)"/></g></g></svg>