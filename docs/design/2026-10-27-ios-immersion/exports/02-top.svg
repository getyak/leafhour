14 4l3-1 6 16-3 1"></path></svg></g></g></g><g id="n10" aria-label="contents-button" transform="translate(145 6)"><rect width="112" height="44" rx="14" fill="none"/><g id="n11" aria-label="book-title-row" transform="translate(17.5 5)"><rect width="77" height="19" rx="0" fill="none"/><text x="0" y="15" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="500" font-size="15" letter-spacing="0" xml:space="preserve">瓦尔登湖</text><g id="n12" aria-label="SPAN" transform="translate(65 0)"><rect width="12" height="19" rx="0" fill="none"/><g transform="translate(0 3)"><svg width="12" height="12" fill="none" stroke="rgb(93, 106, 98)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(93, 106, 98)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"></path></svg></g></g></g><g id="n13" aria-label="nav-version" transform="translate(34 25)"><rect width="44" height="14" rx="0" fill="none"/><text x="0" y="11" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">示例意译</text></g></g><g id="n14" aria-label="排版设置" transform="translate(338 6)"><rect width="44" height="44" rx="50" fill="none"/><text x="12.484375" y="28.5" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="400" font-size="18" letter-spacing="-1" xml:space="preserve">Aa</text></g></g><g id="n15" aria-label="阅读正文" transform="translate(0 54)" clip-path="url(#clip1)"><rect width="402" height="776" rx="0" fill="none"/><g id="n16" aria-label="chapter-heading" transform="translate(26 24)"><rect width="350" height="102.890625" rx="0" fill="none"/><g id="n17" aria-label="SPAN" transform="translate(0 4)"><rect width="39" height="13" rx="0" fill="none"/><text x="0" y="11" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="2" xml:space="preserve">第二章</text></g><g id="n18" aria-label="H1" transform="translate(0 32)"><rect width="350" height="45.890625" rx="0" fill="none"/><text x="0" y="34" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="500" font-size="34" letter-spacing="1" xml:space="preserve">我为何生活</text></g><g id="n19" aria-label="version-label" transform="translate(0 86.890625)"><rect width="350" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">示例意译</text></g></g><g id="n20" aria-label="prose" transform="translate(26 158.890625)"><rect width="350" height="551.25" rx="0" fill="none"/><g id="n21" aria-label="walden-2-001" transform="translate(0 0)"><rect width="350" height="188.5" rx="0" fill="none"/><g id="n22" aria-label="resume-mark" transform="translate(0 0)"><rect width="350" height="16.5" rx="0" fill="none"/><text x="0" y="10" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0.15" xml:space="preserve">上次读到这里</text></g><g id="n23" aria-label="passage-text" transform="translate(0 32.5)"><rect width="332.25" height="150.75" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我来到林中，是想清醒地过日子，</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">面对生活最要紧的事实，看看生活</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">能教给我什么；我不想等到死时才</text><text x="0" y="143.75" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">发现，自己没有真正生活过。</text></g></g><g id="n24" aria-label="walden-2-002" transform="translate(0 215.5)"><rect width="350" height="120.75" rx="0" fill="none"/><g id="n25" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="110.5" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子这样珍贵，我不愿把它过成并</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">非生活的样子；只要还没有到非如</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">此不可的时候，我也不想认命。</text></g></g><g id="n26" aria-label="walden-2-003" transform="translate(0 363.25)"><rect width="350" height="120.75" rx="0" fill="none"/><g id="n27" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="110.5" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我想把生活过深，尝尽它的滋味；</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">用结实、简朴的日子，赶走那些算</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">不上生活的东西。</text></g></g><g id="n28" aria-label="walden-2-004" transform="translate(0 511)"><rect width="350" height="40.25" rx="0" fill="none"/><g id="n29" aria-label="passage-text" transform="translate(0 5)"><rect width="332.25" height="30" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子就在种种琐事里一点点消磨。</text></g></g></g></g><g id="n30" aria-label="显示本章进度" transform="translate(0 830)"><rect width="402" height="44" rx="0" fill="none"/></g><g id="n31" aria-label="home-indicator" transform="translate(140 861)"><rect width="122" height="4" rx="5" fill="rgb(36, 42, 39)"/></g></g></svg>