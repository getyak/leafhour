arker-end="url(#arrow)"/><text x="1100" y="442" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">指向同一段</text><path d="M1230 723H1078" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><text x="1097" y="701" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">查看出处</text><rect x="64" y="895" width="1632" height="135" rx="20" fill="#EDF1EB"/><text x="90" y="939" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="500">自己的笔记</text><text x="90" y="979" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="400">由读者自己写下并保存，指向原句；与讲解、原文和译文保持独立归属。私人笔记不自动进入提问上下文。</text><text x="64" y="1092" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">设计原型 · 2026-10-26 · 与生产实现、原生手感验收分别记录</text></svg>