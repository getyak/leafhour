<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1130" viewBox="0 0 1760 1130"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#365B47"/></marker></defs><rect width="1760" height="1130" fill="#F7F8F5"/><text x="64" y="76" fill="#365B47" font-family="-apple-system,PingFang SC,sans-serif" font-size="26" font-weight="500">Leafhour</text><text x="64" y="144" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="43" font-weight="500">一句话怎样关联所有理解</text><text x="64" y="190" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="400">稳定段落是共同锚点；读者的文字、作者原文与讲解回答分别归属。</text><text x="65" y="270" fill="#365B47" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="500">书的内容</text><text x="650" y="270" fill="#365B47" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="500">位置与回程</text><text x="1230" y="270" fill="#365B47" font-family="-apple-system,PingFang SC,sans-serif" font-size="20" font-weight="500">围绕一句话的讨论</text><rect x="64" y="300" width="420" height="100" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="89" y="343" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">一本书</text><text x="89" y="379" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">来源版本与章节</text><rect x="64" y="465" width="420" height="110" rx="20" fill="#365B47" stroke="#365B47"/><text x="89" y="508" fill="#F7F8F5" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">稳定段落</text><text x="89" y="544" fill="#D9E5DA" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">同一段原文的长期标识</text><rect x="64" y="645" width="420" height="125" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="89" y="688" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">原文与两种译文</text><text x="89" y="724" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">作者原文／直译／意译</text><text x="89" y="752" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">独立保存、独立版本</text><path d="M274 400V457" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><text x="290" y="439" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="400">章节</text><path d="M274 575V637" fill="none" stroke="#365B47" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="300" width="420" height="125" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="675" y="343" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">阅读位置</text><text x="675" y="379" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">段落、段内位置、显示偏好</text><text x="675" y="407" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">主动阅读才更新</text><rect x="650" y="495" width="420" height="125" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="675" y="538" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">讨论位置</text><text x="675" y="574" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">问题、草稿、回答滚动位置</text><text x="675" y="602" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400">面板高度与选文快照</text><rect x="650" y="690" width="420" height="125" rx="20" fill="#FFFFFF" stroke="#DCE3DA"/><text x="675" y="733" fill="#242A27" font-family="-apple-system,PingFang SC,sans-serif" font-size="25" font-weight="500">临时出处</text><text x="675" y="769" fill="#5D6A62" font-family="-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="4