<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><title>01 · 打开即续读</title><defs><clipPath id="clip1"><rect width="402" height="650" rx="0"/></clipPath><clipPath id="clip2"><rect width="402" height="874" rx="0"/></clipPath></defs><g id="n1" aria-label="phone" transform="translate(0 0)" clip-path="url(#clip2)"><rect width="402" height="874" rx="0" fill="rgb(247, 248, 245)"/><g id="n2" aria-label="status-bar" transform="translate(0 0)"><rect width="402" height="54" rx="0" fill="rgb(247, 248, 245)"/><g id="n3" aria-label="SPAN" transform="translate(29 18)"><rect width="31.328125" height="18" rx="0" fill="none"/><text x="0" y="15" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="600" font-size="15" letter-spacing="0" xml:space="preserve">9:41</text></g><g id="n4" aria-label="island" transform="translate(145 12)"><rect width="112" height="30" rx="20" fill="rgb(18, 23, 18)"/></g><g id="n5" aria-label="status-icons" transform="translate(359.140625 13.5)"><rect width="13.859375" height="27" rx="0" fill="none"/><text x="0" y="22" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="600" font-size="23" letter-spacing="0" xml:space="preserve">▰</text></g></g><g id="n6" aria-label="阅读导航" transform="translate(0 54)"><rect width="402" height="56" rx="0" fill="rgba(249, 250, 245, 0.91)"/><g id="n7" aria-label="打开书房" transform="translate(20 6)"><rect width="44" height="44" rx="50" fill="none"/><g id="n8" aria-label="SPAN" transform="translate(11 9)"><rect width="22" height="26" rx="0" fill="none"/><g transform="translate(0 0)"><svg width="22" height="22" fill="none" stroke="rgb(36, 42, 39)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(36, 42, 39)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M9 4v16M14 4l6 15M3 4h3M8 4h3M3 20h8M14 4l3-1 6 16-3 1"></path></svg></g></g></g><g id="n9" aria-label="contents-button" transform="translate(156.5 6)"><rect width="89" height="44" rx="50" fill="none"/><text x="6" y="27.5" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="500" font-size="15" letter-spacing="0" xml:space="preserve">瓦尔登湖</text><g id="n10" aria-label="SPAN" transform="translate(71 13)"><rect width="12" height="18" rx="0" fill="none"/><g transform="translate(0 3)"><svg width="12" height="12" fill="none" stroke="rgb(93, 106, 98)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(93, 106, 98)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"></path></svg></g></g></g><g id="n11" aria-label="排版设置" transform="translate(338 6)"><rect width="44" height="44" rx="50" fill="none"/><text x="12.484375" y="28.5" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="400" font-size="18" letter-spacing="-1" xml:space="preserve">Aa</text></g></g><g id="n12" aria-label="阅读正文" transform="translate(0 110)" clip-path="url(#clip1)"><rect width="402" height="650" rx="0" fill="none"/><g id="n13" aria-label="chapter-heading" transform="translate(26 24)"><rect width="332" height="102.890625" rx="0" fill="none"/><g id="n14" aria-label="SPAN" transform="translate(0 4)"><rect width="39" height="13" rx="0" fill="none"/><text x="0" y="11" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="2" xml:space="preserve">第二章</text></g><g id="n15" aria-label="H1" transform="translate(0 32)"><rect width="332" height="45.890625" rx="0" fill="none"/><text x="0" y="34" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="500" font-size="34" letter-spacing="1" xml:space="preserve">我为何生活</text></g><g id="n16" aria-label="version-label" transform="translate(0 86.890625)"><rect width="332" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">示例意译</text></g></g><g id="n17" aria-label="prose" transform="translate(26 158.890625)"><rect width="332" height="672" rx="0" fill="none"/><g id="n18" aria-label="walden-2-001" transform="translate(0 0)"><rect width="332" height="228.75" rx="0" fill="none"/><g id="n19" aria-label="resume-mark" transform="translate(0 0)"><rect width="332" height="16.5" rx="0" fill="none"/><text x="0" y="10" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0.15" xml:space="preserve">上次读到这里</text></g><g id="n20" aria-label="passage-text" transform="translate(0 32.5)"><rect width="310.109375" height="191" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我来到林中，是想清醒地过日</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">子，面对生活最要紧的事实，看</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">看生活能教给我什么；我不想等</text><text x="0" y="143.75" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">到死时才发现，自己没有真正生</text><text x="0" y="184" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">活过。</text></g><g id="n21" aria-label="选择这一段" transform="translate(332 5)"><rect width="44" height="44" rx="0" fill="none"/><text x="15.96875" y="26" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="20" letter-spacing="0" xml:space="preserve">⌜</text></g></g><g id="n22" aria-label="walden-2-002" transform="translate(0 255.75)"><rect width="332" height="161" rx="0" fill="none"/><g id="n23" aria-label="passage-text" transform="translate(0 5)"><rect width="310.109375" height="150.75" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子这样珍贵，我不愿把它过成</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">并非生活的样子；只要还没有到</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">非如此不可的时候，我也不想认</text><text x="0" y="143.75" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">命。</text></g><g id="n24" aria-label="选择这一段" transform="translate(332 5)"><rect width="44" height="44" rx="0" fill="none"/><text x="15.96875" y="26" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="20" letter-spacing="0" xml:space="preserve">⌜</text></g></g><g id="n25" aria-label="walden-2-003" transform="translate(0 443.75)"><rect width="332" height="120.75" rx="0" fill="none"/><g id="n26" aria-label="passage-text" transform="translate(0 5)"><rect width="310.109375" height="110.5" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">我想把生活过深，尝尽它的滋</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">味；用结实、简朴的日子，赶走</text><text x="0" y="103.5" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">那些算不上生活的东西。</text></g><g id="n27" aria-label="选择这一段" transform="translate(332 5)"><rect width="44" height="44" rx="0" fill="none"/><text x="15.96875" y="26" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="20" letter-spacing="0" xml:space="preserve">⌜</text></g></g><g id="n28" aria-label="walden-2-004" transform="translate(0 591.5)"><rect width="332" height="80.5" rx="0" fill="none"/><g id="n29" aria-label="passage-text" transform="translate(0 5)"><rect width="287.953125" height="70.25" rx="0" fill="none"/><text x="0" y="23" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">日子就在种种琐事里一点点消</text><text x="0" y="63.25" fill="rgb(36, 42, 39)" font-family="Songti SC,sans-serif" font-weight="400" font-size="22" letter-spacing="0.15" xml:space="preserve">磨。</text></g><g id="n30" aria-label="选择这一段" transform="translate(332 5)"><rect width="44" height="44" rx="0" fill="none"/><text x="15.96875" y="26" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="20" letter-spacing="0" xml:space="preserve">⌜</text></g></g></g></g><g id="n31" aria-label="reading-dock" transform="translate(20 773)"><rect width="362" height="64" rx="24" fill="rgba(249, 250, 245, 0.91)" stroke="rgb(220, 227, 218)" stroke-width="1"/><g id="n32" aria-label="progress-button" transform="translate(13 8)"><rect width="68" height="48" rx="16" fill="none"/><g id="n33" aria-label="SPAN" transform="translate(8 6)"><rect width="52" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(93, 106, 98)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">第二章</text></g><g id="n34" aria-label="dock-location" transform="translate(8 24)"><rect width="52" height="18" rx="0" fill="none"/><text x="0" y="14" fill="rgb(36, 42, 39)" font-family="-apple-system,sans-serif" font-weight="400" font-size="13" letter-spacing="0" xml:space="preserve">林中生活</text></g></g><g id="n35" aria-label="dock-divider" transform="translate(163.5 20)"><rect width="1" height="24" rx="0" fill="rgb(220, 227, 218)"/></g><g id="n36" aria-label="companion-button" transform="translate(247 8)"><rect width="102" height="48" rx="16" fill="none"/><g id="n37" aria-label="SPAN" transform="translate(8 11.5)"><rect width="22" height="25" rx="0" fill="none"/><g transform="translate(0 0)"><svg width="22" height="22" fill="none" stroke="rgb(54, 91, 71)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(54, 91, 71)" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H5l-4 3 1.6-6A8 8 0 1 1 20 11Z"></path><path d="M6 10h8M6 14h5"></path></svg></g></g><text x="38" y="29" fill="rgb(54, 91, 71)" font-family="-apple-system,sans-serif" font-weight="400" font-size="14" letter-spacing="0" xml:space="preserve">读到这里</text></g></g><g id="n38" aria-label="home-indicator" transform="translate(140 861)"><rect width="122" height="4" rx="5" fill="rgb(36, 42, 39)"/></g></g></svg>