sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">我来到林中，是想</text><text x="0" y="81.234375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">清醒地过日子，面</text><text x="0" y="132.46875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">对生活最要紧的事</text><text x="0" y="183.703125" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">实，看看生活能教</text><text x="0" y="234.9375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">给我什么；我不想</text><text x="0" y="286.171875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">等到死时才发现，</text><text x="0" y="337.40625" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">自己没有真正生活</text><text x="0" y="388.640625" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">过。</text></g></g><g id="n18" aria-label="walden-2-002" transform="translate(0 436.875)"><rect width="250" height="334.90625" rx="0" fill="none"/><g id="n19" aria-label="resume-mark" transform="translate(0 0)"><rect width="250" height="16.5" rx="0" fill="none"/><text x="0" y="10" fill="rgb(168, 203, 180)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0.15" xml:space="preserve">上次读到这里</text></g><g id="n20" aria-label="passage-text" transform="translate(0 32.5)"><rect width="225.203125" height="296.171875" rx="0" fill="none"/><text x="0" y="30" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">日子这样珍贵，我</text><text x="0" y="81.234375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">不愿把它过成并非</text><text x="0" y="132.46875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">生活的样子；只要</text><text x="0" y="183.703125" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">还没有到非如此不</text><text x="0" y="234.9375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">可的时候，我也不</text><text x="0" y="286.171875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">想认命。</text></g><g id="n21" aria-label="选择这一段" transform="translate(250 5)"><rect width="44" height="44" rx="0" fill="none"/><text x="15.96875" y="26" fill="rgb(168, 203, 180)" font-family="-apple-system,sans-serif" font-weight="400" font-size="20" letter-spacing="0" xml:space="preserve">⌜</text></g></g><g id="n22" aria-label="walden-2-003" transform="translate(0 798.78125)"><rect width="250" height="256.171875" rx="0" fill="none"/><g id="n23" aria-label="passage-text" transform="translate(0 5)"><rect width="225.203125" height="244.9375" rx="0" fill="none"/><text x="0" y="30" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">我想把生活过深，</text><text x="0" y="81.234375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">尝尽它的滋味；用</text><text x="0" y="132.46875" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">结实、简朴的日</text><text x="0" y="183.703125" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">子，赶走那些算不</text><text x="0" y="234.9375" fill="rgb(231, 238, 231)" font-family="Songti SC,sans-serif" font-weight="400" font-size="28" letter-spacing="0.15" xml:space="preserve">上生活的东西。</text></g><g id="n24" aria-label="选择这一段" transform="translate(250 5)"><rect width="44" height="44" rx="0" fill="none"/><text x="15.96875" y="26" fill="rgb(168, 203, 180)" font-family="-apple-system,sans-serif" font-weight="400" font-size="20" letter-spacing="0" xml:space="preserve">⌜</text></g></g></g></g><g id="n25" aria-label="reading-dock" transform="translate(20 639)"><rect width="280" height="64" rx="24" fill="rgba(32, 42, 35, 0.933)" stroke="rgb(67, 81, 71)" stroke-width="1"/><g id="n26" aria-label="progress-button" transform="translate(13 8)"><rect width="94" height="48" rx="16" fill="none"/><g id="n27" aria-label="SPAN" transform="translate(8 6)"><rect width="78" height="16" rx="0" fill="none"/><text x="0" y="12" fill="rgb(174, 188, 175)" font-family="-apple-system,sans-serif" font-weight="400" font-size="11" letter-spacing="0" xml:space="preserve">第二章</text></g><g id="n28" aria-label="dock-location" transform="translate(8 24)"><rect width="78" height="18" rx="0" fill="none"/><text x="0" y="14" fill="rgb(231, 238, 231)" font-family="-apple-system,sans-serif" font-weight="400" font-size="13" letter-spacing="0" xml:space="preserve">生活如此珍贵</text></g></g><g id="n29" aria-label="dock-divider" transform="translate(135.5 20)"><rect width="1" height="24" rx="0" fill="rgb(67, 81, 71)"/></g><g id="n30" aria-label="companion-button" transform="translate(165 8)"><rect width="102" height="48" rx="16" fill="none"/><g id="n31" aria-label="SPAN" transform="translate(8 11.5)"><rect width="22" height="25" rx="0" fill="none"/><g transform="translate(0 0)"><svg width="22" height="22" fill="non