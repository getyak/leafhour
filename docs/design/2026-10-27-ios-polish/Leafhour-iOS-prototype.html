<!doctype html>
<html lang="zh-Hans">
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <meta name="color-scheme" content="light dark" />
  <title>Leafhour · 半屏陪读</title>
  <link rel="icon" href="data:," />
  <style>* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #ecefec;
  color: #242a27;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}
button,
input,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  touch-action: manipulation;
}
.phone button:not(.sheet-grip) {
  transition: transform 120ms ease-out, filter 120ms ease-out;
}
.phone button:not(.sheet-grip):active {
  transform: scale(0.97);
  filter: brightness(0.96);
}
button:disabled {
  cursor: default;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid #759b82;
  outline-offset: 3px;
}
button {
  border: 0;
  background: none;
  color: inherit;
}
a {
  color: inherit;
}
button svg {
  pointer-events: none;
}
svg.icon {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.workbench {
  max-width: 1240px;
  margin: auto;
  padding: 25px 32px 40px;
}
.study-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 30px;
}
.wordmark {
  text-decoration: none;
  font:
    24px Georgia,
    serif;
  letter-spacing: -1px;
}
.wordmark span {
  font:
    12px -apple-system,
    sans-serif;
  color: #617067;
  margin-left: 10px;
  letter-spacing: 0;
}
.study-controls {
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 12px;
  color: #526057;
}
.study-controls button {
  padding: 10px 4px;
}
.study-controls label {
  display: flex;
  gap: 6px;
  align-items: center;
}
.study-controls input {
  accent-color: #365b47;
}
.stage {
  display: flex;
  gap: 70px;
  align-items: center;
  justify-content: center;
}
.phone {
  --paper: #f7f8f5;
  --ink: #242a27;
  --secondary: #5d6a62;
  --accent: #365b47;
  --surface: #fff;
  --wash: #edf1eb;
  --line: #dce3da;
  --glass: #f9faf5e8;
  --highlight: #dce9dc;
  position: relative;
  isolation: isolate;
  width: 402px;
  height: 874px;
  flex-shrink: 0;
  border-radius: 46px;
  background: var(--paper);
  color: var(--ink);
  box-shadow:
    0 30px 100px #25433320,
    0 0 0 1px #1b33251c;
  overflow: hidden;
}
.phone[data-theme="night"] {
  --paper: #191e1b;
  --ink: #e7eee7;
  --secondary: #aebcaf;
  --accent: #a8cbb4;
  --surface: #242d27;
  --wash: #2b382e;
  --line: #435147;
  --glass: #202a23ee;
  --highlight: #3b5141;
}
.status-bar {
  height: 62px;
  position: absolute;
  z-index: 8;
  inset: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 32px;
  font-size: 15px;
  font-weight: 600;
  background: var(--paper);
}
.status-bar .island {
  width: 112px;
  height: 30px;
  border-radius: 20px;
  background: #121712;
  position: absolute;
  top: 15px;
  left: calc(50% - 56px);
}
.status-icons {
  font-size: 23px;
}
.reader-nav {
  position: absolute;
  inset: 62px 0 auto;
  height: 56px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--glass);
  backdrop-filter: blur(20px);
}
.reader-nav > button {
  height: 44px;
  min-width: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 18px;
}
.reader-nav .book-title {
  font-size: 15px;
  flex-direction: column;
  gap: 1px;
  min-width: 112px;
  border-radius: 14px;
  font-weight: 500;
}
.book-title-row { display: flex; gap: 5px; align-items: center; line-height: 19px; }
.nav-version { font-size: 11px; line-height: 14px; color: var(--secondary); font-weight: 400; }
.book-title svg.icon {
  width: 12px;
  height: 12px;
  color: var(--secondary);
}
.type-button {
  letter-spacing: -1px;
}
.reading-scroll {
  overflow-anchor: none;
  position: absolute;
  inset: 118px 0 114px;
  overflow: auto;
  padding: 24px 44px 64px 28px;
  scrollbar-width: none;
  overscroll-behavior: contain;
  scroll-behavior: auto;
}
.reading-scroll::-webkit-scrollbar,
.sheet-body::-webkit-scrollbar {
  display: none;
}
.chapter-heading {
  margin: 0 0 32px;
}
.chapter-heading > span {
  font-size: 11px;
  color: var(--secondary);
  letter-spacing: 2px;
}
.chapter-heading h1 {
  font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  font-size: 34px;
  line-height: 1.35;
  letter-spacing: 1px;
  font-weight: 500;
  margin: 13px 0 9px;
}
.chapter-heading p {
  font-size: 11px;
  color: var(--secondary);
  margin: 0;
}
.passage {
  position: relative;
  font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  font-size: var(--reader-size, 22px);
  line-height: 1.83;
  letter-spacing: 0.15px;
  margin: 0 0 27px;
  white-space: pre-wrap;
}
.passage.source {
  font-family: "New York", Georgia, serif;
  line-height: 1.7;
  font-size: var(--reader-size, 21px);
  letter-spacing: 0;
}
.passage .resume-mark {
  display: block;
  font:
    11px/1.5 -apple-system,
    sans-serif;
  color: var(--accent);
  margin: 0 0 11px;
}
.passage em {
  font-style: normal;
  background: var(--highlight);
  border-radius: 3px;
}
.passage.is-selected .passage-text {
  background: var(--highlight);
  border-radius: 4px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.passage-text::selection { background: var(--highlight); color: var(--ink); }
.select-anchor {
  position: absolute;
  right: -44px;
  top: 5px;
  min-height: 44px;
  width: 44px;
  color: var(--accent);
  opacity: 0.75;
  font:
    20px -apple-system,
    sans-serif;
}
.chapter-end {
  font-size: 12px;
  color: var(--secondary);
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 20px;
  padding: 15px 0;
}
.chapter-end .icon {
  width: 14px;
  height: 14px;
}
.reading-dock {
  position: absolute;
  z-index: 6;
  bottom: 37px;
  left: 24px;
  right: 24px;
  height: 64px;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 24px;
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.4);
  box-shadow: 0 4px 24px #1a302418;
  border: 1px solid var(--line);
}
.reading-dock button {
  height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--accent);
  padding: 0 8px;
  border-radius: 16px;
}
.reading-dock button:first-child {
  display: grid;
  gap: 2px;
  text-align: left;
  font-size: 11px;
  color: var(--secondary);
  align-content: center;
}
.reading-dock .dock-location {
  font-size: 13px;
  color: var(--ink);
}
.dock-divider {
  width: 1px;
  height: 24px;
  background: var(--line);
}
.home-indicator {
  position: absolute;
  z-index: 12;
  bottom: 9px;
  left: calc(50% - 61px);
  width: 122px;
  height: 4px;
  border-radius: 5px;
  background: var(--ink);
  opacity: 0.8;
}
.selection-menu {
  position: absolute;
  z-index: 10;
  top: 118px;
  left: 16px;
  width: min(294px, calc(100% - 32px));
  display: flex;
  padding: 4px;
  background: var(--surface);
  box-shadow: 0 8px 30px #182a2625;
  border: 1px solid var(--line);
  border-radius: 18px;
  animation: selection-in 140ms ease-out;
}
.selection-menu[data-placement="above"]::before,
.selection-menu[data-placement="below"]::before {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  left: calc(var(--anchor-x) - 5px);
  background: var(--surface);
  transform: rotate(45deg);
  z-index: -1;
}
.selection-menu[data-placement="above"]::before { bottom: -6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.selection-menu[data-placement="below"]::before { top: -6px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
@keyframes selection-in {
  from { opacity: 0; scale: 0.97; }
  to { opacity: 1; scale: 1; }
}
.selection-menu button {
  flex: 1;
  min-height: 44px;
  font-size: 13px;
  white-space: nowrap;
  color: var(--accent);
  padding: 5px;
}
.selection-menu button + button {
  border-left: 1px solid var(--line);
  border-radius: 0;
}
.sheet-scrim {
  position: absolute;
  z-index: 8;
  inset: 118px 0 0;
  background: #12201928;
  opacity: 0;
}
.reader-sheet {
  position: absolute;
  z-index: 9;
  inset: auto 0 0;
  height: 88%;
  border-radius: 32px 32px 0 0;
  background: var(--surface);
  box-shadow: 0 -10px 38px #15251d17;
  display: flex;
  flex-direction: column;
  padding-bottom: 31px;
  will-change: transform;
  border-top: 1px solid var(--line);
}
.sheet-grip {
  width: 84px;
  height: 44px;
  margin: -10px 0;
  align-self: center;
  position: relative;
  z-index: 1;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  border-radius: 32px 32px 0 0;
}
.sheet-grip span {
  width: 34px;
  height: 4px;
  background: var(--line);
  border-radius: 8px;
  transition: background-color 100ms;
}
.sheet-grip[data-dragging="true"] span { background: var(--accent); }
.sheet-header {
  height: 47px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 24px;
}
.sheet-header h2 {
  font-size: 20px;
  letter-spacing: -0.3px;
  font-weight: 600;
  margin: 0;
  flex: 1;
}
.sheet-header .sheet-done {
  margin-left: auto;
  height: 44px;
  padding: 0 0 0 12px;
  font-size: 13px;
  color: var(--accent);
}
.sheet-back {
  display: flex;
  align-items: center;
  gap: 2px;
  min-height: 44px;
  color: var(--accent);
  font-size: 13px;
  padding: 0;
}
.sheet-back .icon {
  width: 17px;
  height: 17px;
}
.sheet-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 13px 24px 12px;
  scrollbar-width: none;
  overscroll-behavior: contain;
}
.context-quote {
  padding: 0 0 0 12px;
  border-left: 2px solid var(--accent);
  color: var(--secondary);
  font-size: 13px;
  line-height: 1.65;
  margin-bottom: 20px;
  animation: context-in 140ms ease-out;
}
@keyframes context-in { from { opacity: 0; translate: 0 3px; } to { opacity: 1; translate: 0 0; } }
.context-quote small {
  display: block;
  font-size: 10px;
  color: var(--accent);
  margin-bottom: 5px;
}
.context-quote button {
  color: var(--accent);
  font-size: 11px;
  padding: 8px 0;
  display: block;
  min-height: 44px;
}
.context-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.context-actions .ask-current { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; }
.ask-current .icon { width: 14px; height: 14px; }
.answer-label {
  font-size: 11px;
  color: var(--secondary);
  margin: 5px 0 10px;
}
.answer {
  font-size: 16px;
  line-height: 1.78;
  margin: 0 0 14px;
  white-space: pre-wrap;
}
.source-link {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  min-height: 44px;
  padding: 0 10px;
  border-radius: 12px;
  background: var(--wash);
  color: var(--accent);
  font-size: 11px;
}
.source-link .icon {
  width: 12px;
  height: 12px;
}
.question-bubble {
  margin: 4px 0 20px;
  padding: 12px 15px;
  border-radius: 18px 18px 4px 18px;
  background: var(--wash);
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.answer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  color: var(--accent);
  font-size: 12px;
}
.answer-actions button {
  display: flex;
  gap: 6px;
  align-items: center;
  min-height: 40px;
  padding: 4px;
}
.answer-actions .icon {
  width: 17px;
  height: 17px;
}
.composer {
  padding: 8px 20px 0;
  background: var(--surface);
  flex: none;
  border-top: 1px solid var(--line);
}
.composer form {
  display: flex;
  align-items: center;
  gap: 9px;
}
.composer input {
  flex: 1;
  min-width: 0;
  height: 46px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--paper);
  padding: 0 14px;
  font-size: 16px;
  color: var(--ink);
}
.composer form > button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: var(--surface);
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.draft-return {
  font-size: 11px;
  color: var(--accent);
  padding: 8px 2px;
}
.quote-title {
  font-size: 12px;
  color: var(--secondary);
  margin: 3px 0 17px;
}
.citation-original {
  font:
    21px/1.75 Georgia,
    serif;
  margin: 12px 0 22px;
  white-space: pre-wrap;
}
.citation-translation {
  font:
    20px/1.8 "Songti SC",
    serif;
  white-space: pre-wrap;
}
.quiet-rule {
  height: 1px;
  background: var(--line);
  margin: 22px 0;
}
.primary-button {
  background: var(--accent);
  color: var(--surface);
  border-radius: 17px;
  min-height: 48px;
  padding: 10px 18px;
  font-size: 14px;
}
.secondary-button {
  background: var(--wash);
  color: var(--accent);
  border-radius: 17px;
  min-height: 48px;
  padding: 10px 18px;
  font-size: 14px;
}
.wide-button {
  display: block;
  width: 100%;
  margin-top: 16px;
}
.segmented {
  display: flex;
  padding: 4px;
  background: var(--wash);
  border-radius: 15px;
  gap: 3px;
  margin-bottom: 20px;
}
.segmented button {
  min-height: 44px;
  flex: 1;
  font-size: 12px;
  border-radius: 11px;
  color: var(--secondary);
}
.segmented .active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 2px 6px #152a1910;
}
.note-field {
  border: 0;
  background: transparent;
  color: var(--ink);
  width: 100%;
  resize: none;
  min-height: 220px;
  font-size: 18px;
  line-height: 1.8;
  padding: 8px 0;
}
.note-field::placeholder {
  color: var(--secondary);
  opacity: 0.8;
}
.save-note-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--secondary);
}
.book-cover {
  width: 126px;
  height: 180px;
  padding: 19px 17px;
  color: #edf2e9;
  background: #365b47;
  box-shadow: 5px 6px 12px #142b2420;
  border-radius: 2px 7px 7px 2px;
  position: relative;
  overflow: hidden;
  flex: none;
}
.book-cover .cover-pond {
  position: absolute;
  width: 155px;
  height: 80px;
  border-radius: 50%;
  border: 1px solid #cdd9b28a;
  bottom: -36px;
  left: -12px;
  box-shadow:
    0 -8px 0 0 #365b47,
    0 -9px 0 0 #cdd9b25c,
    0 -17px 0 0 #365b47,
    0 -18px 0 0 #cdd9b240;
}
.book-cover h3 {
  font:
    27px/1.3 "Songti SC",
    serif;
  margin: 0 0 12px;
}
.book-cover p {
  font:
    10px/1.6 Georgia,
    serif;
  margin: 0;
}
.shelf-book {
  display: flex;
  gap: 25px;
  align-items: center;
  padding: 18px 0 28px;
}
.shelf-book h3 {
  font:
    24px/1.4 "Songti SC",
    serif;
  margin: 0 0 8px;
}
.shelf-book p {
  font-size: 12px;
  color: var(--secondary);
  line-height: 1.7;
}
.shelf-actions {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.shelf-note {
  font-size: 12px;
  color: var(--secondary);
  line-height: 1.8;
  margin-top: 24px;
}
.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 64px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  width: 100%;
  text-align: left;
  gap: 14px;
}
.list-row > span {
  display: block;
}
.list-row strong {
  font-size: 15px;
  font-weight: 500;
  display: block;
  line-height: 1.6;
}
.list-row small {
  display: block;
  font-size: 11px;
  line-height: 1.65;
  color: var(--secondary);
  margin-top: 3px;
}
.list-row .icon {
  width: 17px;
  height: 17px;
  color: var(--secondary);
  flex: none;
}
.record-kind {
  font-size: 10px;
  color: var(--accent);
  display: block;
  margin-bottom: 7px;
}
.empty-records {
  padding: 36px 0;
  text-align: left;
}
.empty-records h3 {
  font:
    24px/1.5 "Songti SC",
    serif;
  margin: 0 0 12px;
}
.empty-records p {
  font-size: 14px;
  color: var(--secondary);
  line-height: 1.8;
}
.setting-group {
  margin: 6px 0 28px;
}
.setting-group > label {
  display: block;
  font-size: 12px;
  color: var(--secondary);
  margin-bottom: 14px;
}
.type-size-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}
.type-size-controls button {
  background: var(--wash);
  min-width: 54px;
  min-height: 44px;
  border-radius: 13px;
  color: var(--accent);
  font-size: 18px;
}
.type-size-controls output {
  font-size: 14px;
  flex: 1;
  text-align: center;
}
.appearance-option {
  width: 100%;
  min-height: 65px;
  border-radius: 16px;
  padding: 15px 18px;
  margin: 9px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--line);
  font-size: 14px;
}
.appearance-option[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--wash);
}
.error-card {
  background: var(--wash);
  padding: 17px;
  border-radius: 18px;
  margin: 15px 0;
  font-size: 14px;
  line-height: 1.7;
}
.error-card p {
  margin: 0 0 10px;
}
.error-card button {
  color: var(--accent);
  padding: 8px 0;
  font-size: 13px;
}
.phone-toast {
  position: absolute;
  z-index: 15;
  left: 24px;
  right: 24px;
  bottom: 113px;
  min-height: 48px;
  border-radius: 18px;
  padding: 13px 18px;
  background: var(--ink);
  color: var(--paper);
  font-size: 13px;
  line-height: 1.7;
  box-shadow: 0 5px 20px #0002;
}
.study-notes {
  width: 260px;
  flex-shrink: 0;
  font-size: 14px;
  line-height: 1.9;
  color: #5a685f;
}
.study-state {
  font:
    26px/1.5 "Songti SC",
    serif;
  color: #242a27;
  margin: 0 0 15px;
}
.study-notes > p {
  margin-top: 0;
}
.scenario-links {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 28px 0;
}
.scenario-links button {
  border: 1px solid #d0d9cf;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 12px;
  min-height: 38px;

      $("note-field").value = "";
      persist();
      notify("\u7B14\u8BB0\u5DF2\u4FDD\u5B58");
      if (state.returnFrame) backToDiscussion();
      else closeSheet();
      return;
    }
    if (name === "retry") {
      if (state.offline) {
        notify("\u4ECD\u5728\u65AD\u7F51\u793A\u4F8B\u4E2D\uFF0C\u95EE\u9898\u5DF2\u4FDD\u7559");
        return;
      }
      if (state.pendingTurn) {
        const turn = state.pendingTurn;
        if (state.draft.trim() && (quoteKey(state.quote) !== quoteKey(turn.quote) || state.draft.trim() !== turn.question))
          state.drafts.push({ quote: { ...state.quote }, draft: state.draft });
        state.quote = { ...turn.quote };
        state.question = turn.question;
        state.draft = "";
        $("question-input").value = "";
        rememberTurn({ ...turn, answered: true });
        state.pendingTurn = null;
      }
      state.answered = true;
      state.discussionStarted = true;
      persist();
      renderBody();
      notify("\u5DF2\u6062\u590D\u793A\u4F8B\u8BB2\u89E3");
      return;
    }
    openRoute(name, "full");
  }
  document.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.quote) {
      selectPassage(button.dataset.quote);
      return;
    }
    if (button.dataset.selection) {
      const selected = state.pendingSelection || initialQuote();
      if (button.dataset.selection === "explain") {
        takeQuote(selected, { open: false });
        state.discussionStarted = true;
        persist();
      } else {
        captureComposer();
        state.previewQuote = { ...selected };
        if (["companion", "discussion"].includes(state.route)) state.returnFrame = { route: state.route, detent: state.detent, scrollTop: $("sheet-body").scrollTop, draft: state.draft, quote: { ...state.quote }, question: state.question, answered: state.answered };
        else if (!["note", "original"].includes(state.route)) state.returnFrame = null;
        hideSelectionMenu();
        window.getSelection()?.removeAllRanges();
      }
      openRoute(
        button.dataset.selection === "explain" ? "companion" : button.dataset.selection,
        button.dataset.selection === "explain" ? "half" : "full",
        { capture: false }
      );
      return;
    }
    if (button.dataset.action) {
      action(button.dataset.action);
      return;
    }
    if (button.dataset.layer) {
      state.layer = button.dataset.layer;
      renderReader();
      renderBody();
      persist();
      return;
    }
    if (button.dataset.size) {
      state.size = Math.max(
        18,
        Math.min(28, state.size + Number(button.dataset.size))
      );
      renderReader();
      renderBody();
      persist();
      return;
    }
    if (button.dataset.theme) {
      state.theme = button.dataset.theme;
      renderReader();
      renderBody();
      persist();
      return;
    }
    if (button.dataset.jump) {
      jumpTo(button.dataset.jump);
      return;
    }
    if (button.dataset.record !== void 0) {
      const note = state.notes[Number(button.dataset.record)];
      jumpTo(note.quote.passageId);
      return;
    }
    if (button.dataset.turn !== void 0) {
      const turn = state.turns[Number(button.dataset.turn)];
      takeQuote({ ...turn.quote }, { open: false });
      state.question = turn.question;
      state.answered = turn.answered !== false;
      state.discussionStarted = true;
      openRoute("discussion", "full", { capture: false });
      return;
    }
    if (button.dataset.recordTab) {
      state.recordsTab = button.dataset.recordTab;
      renderBody();
      return;
    }
    if (button.dataset.scenario) showScenario(button.dataset.scenario);
  });
  $("library-button").onclick = () => openRoute("library", "full");
  $("contents-button").onclick = () => openRoute("contents", "full");
  $("progress-button").onclick = () => openRoute("contents", "full");
  $("appearance-button").onclick = () => openRoute("appearance", "full");
  $("companion-button").onclick = enterCompanion;
  $("sheet-done").onclick = closeSheet;
  $("sheet-back").onclick = backToDiscussion;
  $("sheet-scrim").onclick = () => snap("half");
  $("chapter-end").onclick = () => jumpTo(paragraphs[0].id);
  $("night-mode").onclick = () => {
    state.theme = state.theme === "paper" ? "night" : "paper";
    renderReader();
    persist();
  };
  $("offline-mode").onchange = (event) => {
    state.offline = event.target.checked;
    if (["companion", "discussion"].includes(state.route)) renderBody();
    setStudy(
      state.offline ? "\u65AD\u7F51\u4ECD\u53EF\u8BFB" : "\u8FDE\u63A5\u6062\u590D\u793A\u4F8B",
      state.offline ? "\u539F\u6587\u4E0E\u5DF2\u7F13\u5B58\u5185\u5BB9\u7EE7\u7EED\u53EF\u8BFB\uFF0C\u95EE\u9898\u548C\u9009\u6587\u4ECD\u4FDD\u7559\u3002" : "\u5DF2\u6709\u95EE\u9898\u53EF\u4EE5\u663E\u5F0F\u91CD\u8BD5\u3002"
    );
  };
  $("reopen").onclick = () => {
    captureComposer();
    persist();
    location.reload();
  };
  $("question-input").oninput = (event) => {
    state.draft = event.target.value;
    persist();
  };
  $("question-input").onfocus = () => snap("full");
  $("question-form").onsubmit = (event) => {
    event.preventDefault();
    const question = $("question-input").value.trim();
    if (!question) return;
    state.question = question;
    state.discussionStarted = true;
    const turn = {
      id: "prototype-" + Date.now(),
      question,
      quote: { ...state.quote },
      answered: !state.offline
    };
    state.pendingTurn = turn;
    if (!state.offline) {
      rememberTurn(turn);
      state.pendingTurn = null;
      state.draft = "";
      state.answered = true;
    }
    persist();
    $("question-input").value = state.draft;
    openRoute("discussion", "full", { capture: false });
  };
  $("draft-return").onclick = () => {
    captureComposer();
    const previous = state.drafts.pop();
    if (!previous) return;
    if (state.draft.trim())
      state.drafts.unshift({ quote: { ...state.quote }, draft: state.draft });
    state.quote = previous.quote;
    state.draft = previous.draft;
    state.question = "";
    state.answered = false;
    state.discussionStarted = true;
    state.returnFrame = null;
    persist();
    renderBody();
  };
  $("reading-scroll").addEventListener(
    "scroll",
    () => {
      state.readingTop = $("reading-scroll").scrollTop;
      if (!state.restoringReading && !state.readingTransition && readingGeometryMatches())
        state.readingPosition = captureReadingPosition($("reading-scroll"), readerIdentity()) || state.readingPosition;
      const current = [...document.querySelectorAll("[data-passage]")].find(
        (p) => p.getBoundingClientRect().bottom > $("reading-scroll").getBoundingClientRect().top + 36
      );
      $("dock-location").textContent = current ? ["\u6797\u4E2D\u751F\u6D3B", "\u751F\u6D3B\u5982\u6B64\u73CD\u8D35", "\u6D3B\u5F97\u6DF1\u5165", "\u7410\u4E8B\u4E0E\u65E5\u5B50"][paragraphs.findIndex((p) => p.id === current.id)] : "\u6797\u4E2D\u751F\u6D3B";
      persist();
      if (!$("selection-menu").hidden) requestAnimationFrame(positionSelectionMenu);
    },
    { passive: true }
  );
  for (const type of ["wheel", "touchstart", "pointerdown", "keydown"])
    $("reading-scroll").addEventListener(type, () => {
      state.restoringReading = false;
      state.readingTransition = false;
      $("reading-scroll").removeAttribute("data-restoring");
    }, { passive: true });
  document.addEventListener("selectionchange", () => {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || !selection.rangeCount) return;
    const range = selection.getRangeAt(0), startNode = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer, endNode = range.endContainer.nodeType === 3 ? range.endContainer.parentElement : range.endContainer, startRoot = startNode?.closest(".passage-text"), endRoot = endNode?.closest(".passage-text");
    if (!startRoot || startRoot !== endRoot) {
      hideSelectionMenu();
      return;
    }
    const prefix = document.createRange();
    prefix.selectNodeContents(startRoot);
    prefix.setEnd(range.startContainer, range.startOffset);
    const id = startRoot.closest("[data-passage]").dataset.passage, start = prefix.toString().length, text = range.toString();
    if (!text.trim()) return;
    hideSelectionMenu();
    state.pendingSelection = captureQuote(id, text, start);
    state.selectionRange = range.cloneRange();
    $("selection-menu").hidden = false;
    positionSelectionMenu();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      if (state.route === "citation") backToDiscussion();
      else if (!$("selection-menu").hidden) hideSelectionMenu();
      else if (state.route !== "closed") closeSheet();
    }
  });
  $("selection-menu").addEventListener("mousedown", (event) => event.preventDefault());
  var outsideSelectionPress = null;
  document.addEventListener("pointerdown", (event) => {
    outsideSelectionPress = null;
    if ($("selection-menu").hidden || $("selection-menu").contains(event.target) || event.target.closest?.("[data-quote]")) return;
    if (event.target.closest?.("#reading-scroll")) outsideSelectionPress = { id: event.pointerId, x: event.clientX, y: event.clientY, distance: 0 };
    else hideSelectionMenu();
  });
  document.addEventListener("pointermove", (event) => {
    const press = outsideSelectionPress;
    if (press?.id === event.pointerId) press.distance = Math.max(press.distance, Math.hypot(event.clientX - press.x, event.clientY - press.y));
  }, { passive: true });
  document.addEventListener("pointerup", (event) => {
    const press = outsideSelectionPress;
    if (press?.id !== event.pointerId) return;
    outsideSelectionPress = null;
    if (Math.max(press.distance, Math.hypot(event.clientX - press.x, event.clientY - press.y)) < 6) hideSelectionMenu();
  }, { passive: true });
  document.addEventListener("pointercancel", () => {
    outsideSelectionPress = null;
  }, { passive: true });
  var grip = $("sheet-grip");
  grip.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || state.drag) return;
    const interruptedClosing = restoreClosingPanel();
    cancelAnimationFrame(state.raf);
    $("reader-sheet").dataset.motion = "dragging";
    state.readingTransition = true;
    grip.dataset.dragging = "true";
    state.velocity = 0;
    state.drag = {
      id: event.pointerId,
      startY: event.clientY,
      start: state.y,
      previousY: event.clientY,
      time: performance.now(),
      velocity: 0,
      maxDistance: 0,
      interruptedClosing,
      samples: [{ y: event.clientY, time: performance.now() }]
    };
    grip.setPointerCapture(event.pointerId);
    paintSheet();
  });
  grip.addEventListener("pointermove", (event) => {
    const d = state.drag;
    if (!d || d.id !== event.pointerId) return;
    const now = performance.now();
    d.samples.push({ y: event.clientY, time: now });
    while (d.samples.length > 2 && now - d.samples[0].time > 80) d.samples.shift();
    const first = d.samples[0];
    d.velocity = (event.clientY - first.y) / Math.max(1, now - first.time) * 1e3;
    d.previousY = event.clientY;
    d.time = now;
    d.maxDistance = Math.max(d.maxDistance, Math.abs(event.clientY - d.startY));
    const candidate = d.start + event.clientY - d.startY;
    const extent = Math.max(1, Math.min(16, phoneHeight() * 0.12 - document.querySelector(".status-bar").clientHeight - 8));
    state.y = resistedPosition(candidate, 0, targetY("closed"), extent);
    paintSheet();
  });
  function endDrag(event) {
    const d = state.drag;
    if (!d || d.id !== event.pointerId) return;
    state.drag = null;
    delete grip.dataset.dragging;
    const moved = Math.max(d.maxDistance, Math.abs(event.clientY - d.startY));
    if (moved < 5) {
      snap(d.interruptedClosing ? state.detent : state.detent === "full" ? "half" : "full");
      return;
    }
    let velocity = performance.now() - d.time > 100 ? 0 : d.velocity;
    if (state.y < 0 && velocity < 0 || state.y > targetY("closed") && velocity > 0) velocity = 0;
    state.velocity = velocity;
    const stops = [
      ["full", targetY("full")],
      ["half", targetY("half")],
      ["closed", targetY("closed")]
    ];
    const destination = nearestDetent(state.y, velocity, stops);
    if (destination === "closed") closeSheet();
    else snap(destination);
  }
  grip.addEventListener("pointerup", endDrag);
  function cancelDrag() {
    if (!state.drag) return;
    state.drag = null;
    delete grip.dataset.dragging;
    state.velocity = 0;
    snap(state.detent);
  }
  grip.addEventListener("pointercancel", cancelDrag);
  grip.addEventListener("lostpointercapture", cancelDrag);
  function showScenario(name) {
    if (name === "resume") {
      closeSheet();
      jumpTo(paragraphs[0].id);
      return;
    }
    if (name === "selected") {
      closeSheet();
      jumpTo(paragraphs[0].id);
      selectPassage(paragraphs[0].id);
      return;
    }
    if (name === "citation") {
      if (!["companion", "discussion"].includes(state.route))
        openRoute("discussion", "full");
      visitCitation();
      return;
    }
    if (name === "note") {
      if (state.route === "closed") openRoute("companion", "half");
      action("note");
      return;
    }
    if (name === "night") {
      state.theme = "night";
      renderReader();
      openRoute("companion", "half");
      return;
    }
    if (name === "offline") {
      state.offline = true;
      $("offline-mode").checked = true;
      openRoute("companion", "half");
      return;
    }
    openRoute(name, name === "companion" ? "half" : "full");
  }
  drawIcons();
  renderReader({ restore: false });
  var hadStoredLocator = saved.readingPosition != null;
  var restoredReading = state.readingPosition && restoreReaderAnchor(state.readingPosition);
  if (!restoredReading) {
    $("reading-scroll").scrollTop = hadStoredLocator ? 0 : state.readingTop;
    state.readingTop = $("reading-scroll").scrollTop;
    state.readingPosition = captureReadingPosition($("reading-scroll"), readerIdentity());
    const entry = state.readingPosition?.passageId || paragraphs[0].id;
    if (entry !== state.resumePassageId) {
      state.resumePassageId = entry;
      renderReader();
    }
  }
  rememberReadingGeometry();
  state.y = targetY("closed");
  setStudy("\u6253\u5F00\u5373\u7EED\u8BFB", "\u4ECE\u4E0A\u6B21\u7684\u4F4D\u7F6E\u8FDB\u5165\u6B63\u6587\uFF0C\u966A\u8BFB\u9762\u677F\u4FDD\u6301\u6536\u8D77\u3002");
  updateContextChrome();
  window.addEventListener("resize", () => {
    if (state.readingPosition) restoreReaderAnchor(state.readingPosition);
    if (state.route !== "closed") snap(state.detent, { immediate: true });
    positionSelectionMenu();
  });
  window.addEventListener("pagehide", persist);
  var params = new URLSearchParams(location.search);
  if (params.get("state")) showScenario(params.get("state"));
  grip.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      const interruptedClosing = restoreClosingPanel();
      snap(interruptedClosing ? state.detent : state.detent === "full" ? "half" : "full");
    }
  });
  document.addEventListener("input", (event) => {
    if (event.target.id === "note-field") {
      state.noteDrafts[quoteKey(viewQuote())] = event.target.value;
      persist();
    }
  });
  for (const event of ["wheel", "touchstart", "keydown"])
    $("sheet-body").addEventListener(
      event,
      () => {
        state.scrollRevision = (state.scrollRevision || 0) + 1;
      },
      { passive: true }
    );
})();
