name: Leafhour
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  LeafhourCore:
    path: LeafhourCore
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Leafhour/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: Leafhour
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Leafhour:
    type: application
    platform: iOS
    sources:
      - Leafhour
    dependencies:
      - package: LeafhourCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
  LeafhourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LeafhourUITests]
    dependencies:
      - target: Leafhour
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        LEAFHOUR_UI_TEST_BUNDLE_ID: $(LEAFHOUR_BUNDLE_ID).uitests
        PRODUCT_BUNDLE_IDENTIFIER: $(LEAFHOUR_UI_TEST_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
  LeafhourAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LeafhourAppTests]
    dependencies:
      - target: Leafhour
      - package: LeafhourCore
        product: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: $(LEAFHOUR_BUNDLE_ID).apptests
        CODE_SIGN_STYLE: Automatic
schemes:
  Leafhour:
    build:
      targets:
        Leafhour: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [LeafhourAppTests, LeafhourUITests]
    archive:
      config: Release
