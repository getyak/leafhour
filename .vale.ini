# GET-202 copy guardrails (Vale).
#
# The corpus is the exported reader-facing copy (build/copy/*.txt). Rules from
# the GET-202 issue lists: T1 wording fails the lint, T2/T3 stay visible
# warnings. Existing catalogue debt is bound item-by-item in
# tools/copy-lint-debt.json; justified terms use tools/copy-lint-allowances.json.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.{md,txt}]
BasedOnStyles = Leafhour
