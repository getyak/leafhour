<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旁读登录验证码</title></head>
<body style="margin:0;background:#f5f6f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#252b26">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:40px 16px">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px;background:#fffefa;border:1px solid #e6e5de;border-radius:16px"><tr><td style="padding:36px 32px">
      <p style="margin:0 0 24px;font-size:22px;color:#526b43">旁读 <span style="font-size:10px;letter-spacing:2px">MARGINALIA</span></p>
      <h1 style="font-size:24px;font-weight:600;margin:0 0 12px">进入你的书房</h1>
      <p style="font-size:14px;line-height:1.8;color:#737973;margin:0">在旁读登录页面输入这组验证码：</p>
      <p style="font-family:ui-monospace,monospace;font-size:32px;font-weight:600;letter-spacing:8px;padding:22px 16px;margin:24px 0;background:#f0f3e9;border-radius:8px;text-align:center">{{ .Token }}</p>
      <p style="font-size:13px;line-height:1.8;margin:0 0 20px">验证码 10 分钟内有效，只能使用一次。请勿转发给他人。</p>
      <p style="font-size:12px;line-height:1.8;color:#93988f;border-top:1px solid #eaede5;padding-top:20px;margin:0">如果你没有请求登录，可以忽略这封邮件。</p>
    </td></tr></table>
  </td></tr></table>
</body></html>
