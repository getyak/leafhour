<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>循页重设密码验证码</title></head>
<body style="margin:0;background:#f5f5ee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#26382f">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background:#fffdf7;border:1px solid #e7e5da;border-radius:14px"><tr><td style="padding:30px 28px">
      <p style="margin:0 0 22px;font-size:20px;color:#304e3e">循页 <span style="font-size:10px;letter-spacing:2px">PAGE BY PAGE</span></p>
      <h1 style="font-size:23px;font-weight:500;margin:0 0 12px">重新设置登录密码</h1>
      <p style="font-size:14px;line-height:1.8;color:#6d736c;margin:0">在循页的验证页面输入这组验证码：</p>
      <p style="font-family:ui-monospace,monospace;font-size:32px;letter-spacing:8px;padding:20px 12px;margin:22px 0;background:#edf1e8;border-radius:8px;text-align:center">{{ .Token }}</p>
      <p style="font-size:13px;line-height:1.8;margin:0 0 20px">验证码 10 分钟内有效。验证邮箱后，即可设置新密码。</p>
      <p style="font-size:12px;line-height:1.8;color:#6d736c;border-top:1px solid #e7e8df;padding-top:18px;margin:0">如果你没有申请重设密码，可以忽略这封邮件。原密码仍可使用。</p>
    </td></tr></table>
  </td></tr></table>
</body></html>
