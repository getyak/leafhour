name: Platform typography acceptance

on:
  pull_request:
    paths:
      - .github/workflows/platform-typography.yml
      - tools/platform-typography.mjs
      - tools/lib/platform-android.mjs
      - tools/lib/platform-cdp.mjs
      - tools/lib/platform-font-observer.mjs
      - tests/platform-android.test.mjs
      - tests/platform-popover-observer.test.mjs
      - tests/platform-popover-product.test.mjs
      - app/typography.css
      - app/fonts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typography-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-desktop-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record installed stock Linux fonts without altering them
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/typography"
          fc-list --format '%{family}|%{style}|%{file}\n' | sort > "$RUNNER_TEMP/typography/stock-fonts.txt"
      - name: Record installed stock Windows fonts without altering them
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/typography" | Out-Null
          Get-ChildItem C:/Windows/Fonts -File | Select-Object -ExpandProperty Name | Sort-Object | Set-Content "$env:RUNNER_TEMP/typography/stock-fonts.txt"
      - name: Observe actual isolated product in installed Chrome
        shell: pwsh
        run: node tools/platform-typography.mjs "$env:RUNNER_TEMP/typography"
      - name: Preserve bounded anonymous evidence even after assertion failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typography-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/typography/receipt.json
            ${{ runner.temp }}/typography/stock-fonts.txt
            ${{ runner.temp }}/typography/*.png
          if-no-files-found: error
          retention-days: 3

  actual-android-api34:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Bind task-owned Android state to the running job
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/get173-android/android-user-home" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/get173-android/android-avd-home" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Install the emulator's missing host PulseAudio client library
        run: |
          # The official runner image lacks libpulse.so.0 required by emulator -version.
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y libpulse0
          dpkg-query -W -f='${Package} ${Version}\n' libpulse0
      - name: Configure and verify hosted KVM acceleration for the owned AVD
        shell: bash
        run: |
          id
          test -c /dev/kvm || { echo "::error::/dev/kvm is missing or not a character device"; exit 1; }
          ls -l /dev/kvm
          # Official GitHub hosted-runner KVM setup, confined to this ephemeral VM.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo -n tee /etc/udev/rules.d/99-leafhour-get173-kvm.rules > /dev/null
          sudo -n udevadm control --reload-rules
          sudo -n udevadm trigger --name-match=kvm
          sudo -n udevadm settle --timeout=10
          ls -l /dev/kvm
          test -r /dev/kvm || { echo "::error::KVM is not readable"; exit 1; }
          test -w /dev/kvm || { echo "::error::KVM is not writable"; exit 1; }
      - name: Verify the currently served official manifest against the pinned package facts
        run: node tools/lib/platform-android.mjs verify-system-image-manifest
      - name: Probe official SDK inventory and install only the missing emulator and one system image
        run: |
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$SDKMANAGER"
          test -x "$ADB"
          if [ -x "$EMULATOR" ]; then
            echo "Official emulator package already installed"
          else
            echo "Official emulator package missing; installing it through the official SDK manager"
            yes | "$SDKMANAGER" "emulator" > /dev/null
          fi
          yes | "$SDKMANAGER" "platform-tools" "system-images;android-34;google_apis_playstore;x86_64" > /dev/null
          test -x "$EMULATOR"
          "$ADB" version
          "$EMULATOR" -version > "$RUNNER_TEMP/get173-android/emulator-version.txt"
          head -n 2 "$RUNNER_TEMP/get173-android/emulator-version.txt"
          "$EMULATOR" -accel-check
          "$SDKMANAGER" --list_installed | grep -E '^(  )?(emulator|platform-tools|system-images;android-34;google_apis_playstore;x86_64)'
      - name: Observe actual anonymous product typography in task-owned stock Chrome on the AVD
        run: node tools/platform-typography.mjs --android "$RUNNER_TEMP/typography-android"
      - name: Preserve bounded anonymous Android evidence even after assertion failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typography-android-api34-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/typography-android/receipt.json
            ${{ runner.temp }}/typography-android/*.png
          if-no-files-found: error
          retention-days: 3
