name: Release iOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_testflight:
        description: Explicitly upload the verified current main build to ASC (channel must also be enabled)
        required: true
        type: boolean
        default: false
      version_override:
        description: Optional X.Y.Z marketing version; verify the existing ASC version first
        type: string
        required: false
      reconcile_run_id:
        description: Read-only Apple processing check for an original release run; never archive or upload again
        type: string
        required: false

permissions:
  contents: read

# Shared with signing maintenance. Never cancel an in-flight Apple upload.
concurrency:
  group: leafhour-ios-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide and freeze verified source
    if: github.repository == 'getyak/leafhour' && github.ref == 'refs/heads/main' && (inputs.reconcile_run_id || '') == '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Evaluate disabled-by-default release policy
        id: plan
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          IOS_TESTFLIGHT_ENABLED: ${{ vars.IOS_TESTFLIGHT_ENABLED }}
          IOS_AUTOMATIC_TESTFLIGHT: ${{ vars.IOS_AUTOMATIC_TESTFLIGHT }}
          IOS_APP_ID: ${{ vars.IOS_APP_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_BUILD_NUMBER_OFFSET: ${{ vars.IOS_BUILD_NUMBER_OFFSET }}
          PUBLISH_TESTFLIGHT: ${{ inputs.publish_testflight || false }}
          VERSION_OVERRIDE: ${{ inputs.version_override || '' }}
        with:
          script: |
            const {prepare} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ios/prepare.mjs`);
            await prepare({github, context, core});
      - name: Preserve only the non-sensitive original release plan
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 90

  archive-upload:
    name: Archive and upload to ASC on one ephemeral runner
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 130
    environment: testflight
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-release-plan
      - name: Refuse same-build re-archives on rerun (use read-only reconciliation)
        run: node scripts/ios/release.mjs can-submit
      - name: Verify exact existing ASC application and unused version/build
        run: node scripts/ios/release.mjs preflight
      - name: Verify pinned native dependency and release helpers
        run: |
          node tools/verify-ios-vendor.mjs
          node --test tests/ios-*.test.mjs
          python3 -m unittest discover -s tests -p 'test_ios_*.py'
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" -ge 26
      - name: Install scoped signing material and archive exact IPA locally
        run: bash scripts/ios/archive.sh
      - name: Check local IPA digest before controlled ASC upload
        run: node scripts/ios/release.mjs check-package
      - name: Probe, submit at most once, and confirm exact Apple VALID state
        run: bash scripts/ios/upload.sh
      - name: Recheck local IPA and create allowlisted non-sensitive receipt
        run: |
          node scripts/ios/release.mjs check-package
          node scripts/ios/release.mjs receipt
      - name: Retain only the minimal JSON processing receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-testflight-receipt
          path: build/ios/testflight-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove ephemeral IPA and archive; never publish a GitHub binary artifact or release
        if: always()
        run: |
          rm -f build/ios/Leafhour.ipa build/ios/release-plan.json build/ios/apple-validation.json
          rm -rf "${RUNNER_TEMP:?}/Leafhour.xcarchive" "${RUNNER_TEMP:?}/leafhour-release-derived"

  reconcile:
    name: Read-only original Apple processing reconciliation
    if: github.event_name == 'workflow_dispatch' && github.repository == 'getyak/leafhour' && github.ref == 'refs/heads/main' && inputs.reconcile_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: testflight
    permissions:
      contents: read
      actions: read
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      IOS_APP_ID: ${{ vars.IOS_APP_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      ORIGINAL_RUN_ID: ${{ inputs.reconcile_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-release-plan
          run-id: ${{ inputs.reconcile_run_id }}
          github-token: ${{ github.token }}
      - name: Validate original app, source and successful CI provenance
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        with:
          script: |
            const {readFileSync} = require('node:fs');
            const {verifyOriginalPlan} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ios/receipt-provenance.mjs`);
            const plan = JSON.parse(readFileSync('release-plan.json', 'utf8'));
            await verifyOriginalPlan(plan, {appId:process.env.IOS_APP_ID,bundleId:process.env.IOS_BUNDLE_ID}, process.env.ORIGINAL_RUN_ID, {getRun:async id=>(await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(id)})).data});
      - name: Query Apple only; no archive, upload, signing changes or success receipt
        run: |
          mkdir -p build/ios
          node scripts/ios/release.mjs wait
      - name: Retain non-sensitive observation without treating it as a successful release baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-processing-observation
          path: build/ios/apple-validation.json
          if-no-files-found: error
          retention-days: 90
