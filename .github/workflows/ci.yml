name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:vercel
      - name: Ensure private content is absent
        run: |
          test ! -d dist/content
          test ! -d dist/local
          test ! -d dist/_briefs
          ! find dist -type f -size +200k | grep -q .
