name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan CI and check workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      native: ${{ steps.plan.outputs.native }}
      catalog: ${{ steps.plan.outputs.catalog }}
      ios_release: ${{ steps.plan.outputs.ios_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check impact selection and failure handling without installing dependencies
        run: |
          node --test tests/ci-resource-plan.test.mjs tests/production-status.test.mjs tests/production-trigger.test.mjs tests/readme-languages.test.mjs
          python3 -m unittest discover -s tests -p 'test_hourly_publisher*.py'
      - name: Select required areas from this event's exact commit range
        id: plan
        run: node tools/ci-resource-plan.mjs
      - name: Lint all workflow contracts with the pinned official actionlint module
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml

  catalog-sources:
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/catalog-requirements.txt
      - name: Install the pinned offline catalog parser dependencies
        run: python -m pip install -r tools/catalog-requirements.txt
      - name: Check author text, verse, source boundaries and exclusion guards offline
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tests -p 'test_classic_*.py'

  test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAFHOUR_VALE_BIN: ${{ github.workspace }}/.copy-tools/vale
      LEAFHOUR_TEXTLINT_BIN: ${{ github.workspace }}/tools/copy-tooling/node_modules/.bin/textlint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the pinned copy lint toolchain without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/copy-tooling
      - name: Install the checksum-pinned official Vale release
        run: node tools/copy-install-vale.mjs --dest .copy-tools --platform linux --arch x64
      - name: Fetch and verify the fixed source object used by existing copy debt
        run: |
          git fetch --depth=1 origin 43187d0ecaa63aa6575700677744c7cf4b3d099e
          git cat-file -e 43187d0ecaa63aa6575700677744c7cf4b3d099e^{commit}
      - name: Export and lint product copy with the real pinned CLIs
        run: |
          node scripts/export-copy.mjs --root . --out build/copy
          git ls-files --error-unmatch docs/copy/copy-inventory.json docs/copy/copy-inventory.csv docs/copy/copy-candidates.csv
          git diff --exit-code -- docs/copy
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const untracked = execFileSync('git', ['ls-files', '--others', '--exclude-standard', '--', 'docs/copy'], {encoding:'utf8'});
          if (untracked.trim()) throw Error('Untracked copy outputs: ' + untracked);
          JS
          node tools/copy-lint.mjs --manifest build/copy/manifest.json
      - name: Verify that planted copy violations fail and clean copy passes
        run: node tools/copy-canaries.mjs
      - name: Require native PostgreSQL for isolated financial ledger checks
        run: |
          pg_config --version
          for tool in initdb pg_ctl psql; do
            test -x "$(pg_config --bindir)/$tool"
          done
      - run: npm run verify:deploy
      - name: Verify that copy tooling is absent from the traced function runtime
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('.reader-runtime/manifest.json', 'utf8'));
          if (!Array.isArray(manifest.files) || !manifest.files.length) throw Error('Runtime trace is missing');
          if (manifest.files.some(file => typeof file !== 'string' || !file.length)) throw Error('Runtime trace contains invalid paths');
          const unexpected = manifest.files.filter(file => /(?:^|\/)(?:@textlint|textlint[^/]*|prh|vale|copy-tooling)(?:\/|$)/.test(file));
          if (unexpected.length) throw Error('Copy tooling entered the runtime: ' + unexpected.join(', '));
          console.log('Checked ' + manifest.files.length + ' traced runtime files: copy tooling absent.');
          JS
      - name: Check the packaged reader in the AWS function runtime without network or model requests
        run: >-
          docker run --rm --network none --platform linux/amd64
          --read-only --tmpfs /tmp:rw,exec,nosuid,size=256m
          --entrypoint /var/lang/bin/node
          --mount type=bind,source="$PWD",target=/workspace,readonly
          public.ecr.aws/lambda/nodejs:24@sha256:9a096eb2cb6fa96419b5742e1b4a64b6bf7d3aa954beb92461a2a3e072061497
          /workspace/tools/check-reader-runtime.mjs /workspace/.reader-runtime
      - name: Render PDF evidence from the traced function package in the AWS runtime
        run: >-
          docker run --rm --network none --platform linux/amd64
          --read-only --tmpfs /tmp:rw,exec,nosuid,size=256m
          --entrypoint /var/lang/bin/node
          --mount type=bind,source="$PWD",target=/workspace,readonly
          public.ecr.aws/lambda/nodejs:24@sha256:9a096eb2cb6fa96419b5742e1b4a64b6bf7d3aa954beb92461a2a3e072061497
          /workspace/tools/check-pdf-package.mjs /workspace
      - name: Preserve copy warnings, existing debt and source mappings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-guardrails-evidence
          path: |
            build/copy/lint-report.json
            build/copy/manifest.json
            .reader-runtime/manifest.json
            docs/copy/copy-inventory.csv
            docs/copy/copy-candidates.csv
          if-no-files-found: warn
          include-hidden-files: true

  native-ios:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    defaults:
      run:
        shell: bash
    # Explicit Intel pool avoids the documented arm64 capacity abandonment.
    # The app below still builds the arm64 iOS Simulator target.
    runs-on: macos-15-intel
    # Cold arm64 and Intel simulator builds must finish before card assertions.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the pinned native archive dependency without network
        run: node tools/verify-ios-vendor.mjs
      - name: Test complete book import, offline integrity and recovery on the host
        env:
          LEAFHOUR_TEST_ROOT: ${{ runner.temp }}/leafhour-native-fixtures
        run: |
          swift test --package-path apps/ios/LeafhourCore --scratch-path "$RUNNER_TEMP/leafhour-swift" --jobs 2 2>&1 | tee "$RUNNER_TEMP/leafhour-core.log"
      - name: Build native iOS app without Apple account or signing
        run: |
          xcodebuild -project apps/ios/Leafhour.xcodeproj -scheme Leafhour -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/leafhour-ios" -jobs 2 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/leafhour-ios.log"
      - name: Verify selected-content cards on an isolated simulator
        run: |
          export LEAFHOUR_CI_IOS_SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          SIMULATOR_RUNTIME=$(xcrun simctl list runtimes --json | node --input-type=module -e '
            let raw="";for await(const chunk of process.stdin)raw+=chunk;
            const sdk=process.env.LEAFHOUR_CI_IOS_SDK_VERSION.split(".").map(Number);
            const candidates=JSON.parse(raw).runtimes.filter(r=>r.isAvailable&&r.identifier.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-")&&Number(r.version.split(".")[0])===sdk[0]&&Number(r.version.split(".")[1])<=sdk[1]);
            candidates.sort((a,b)=>Number(b.version.split(".")[1])-Number(a.version.split(".")[1]));
            if(!candidates.length)throw Error("No installed iOS runtime matches the selected Xcode SDK");
            console.log(candidates[0].identifier);')
          SIMULATOR_ID=$(xcrun simctl create LeafhourShareCI 'com.apple.CoreSimulator.SimDeviceType.iPhone-16' "$SIMULATOR_RUNTIME")
          trap 'xcrun simctl delete "$SIMULATOR_ID"' EXIT
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -project apps/ios/Leafhour.xcodeproj -scheme LeafhourShareCards -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/leafhour-ios" -resultBundlePath "$RUNNER_TEMP/leafhour-share.xcresult" -jobs 2 CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:LeafhourShareCardTests/BookShareCardTests test 2>&1 | tee "$RUNNER_TEMP/leafhour-share.log"
      - name: Preserve native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-evidence
          path: |
            ${{ runner.temp }}/leafhour-core.log
            ${{ runner.temp }}/leafhour-ios.log
            ${{ runner.temp }}/leafhour-share.log
            ${{ runner.temp }}/leafhour-share.xcresult
          if-no-files-found: warn

  ios-release-contracts:
    needs: changes
    if: needs.changes.outputs.ios_release == 'true'
    name: Validate dormant TestFlight automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test authorization, Apple states, artifact binding and signing guards offline
        run: |
          node --test tests/ios-*.test.mjs
          python3 -m unittest discover -s tests -p 'test_ios_*.py'
          bash -n scripts/ios/archive.sh scripts/ios/upload.sh
  gate:
    name: CI gate
    if: always()
    needs: [changes, catalog-sources, test, native-ios, ios-release-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require success for every selected area
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node tools/ci-resource-gate.mjs

