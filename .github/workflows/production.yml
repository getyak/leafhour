name: Production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'getyak/marginalia-reader' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the source deployed directly from the public repository
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: npm run smoke:production
